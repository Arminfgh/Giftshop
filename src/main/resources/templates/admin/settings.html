<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Settings')}"></head>
<body class="admin-body">
<aside th:replace="~{fragments/admin :: sidebar('settings')}"></aside>
<div class="admin-main">
    <header th:replace="~{fragments/admin :: topbar('Shop settings')}"></header>
    <div class="admin-content">

        <div th:if="${toast}" class="toast success" th:text="${toast}"></div>
        <div th:if="${error}" class="toast error" th:text="${error}"></div>

        <!-- General settings -->
        <div class="admin-card">
            <div class="admin-card-head"><h2>Shop information</h2></div>
            <form th:action="@{/admin/settings/save}" method="post" class="admin-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Shop name <span class="req">*</span></label>
                        <input type="text" name="shopName" th:value="${settings.shopName}" required>
                    </div>
                    <div class="form-group">
                        <label>Logo emoji</label>
                        <input type="text" name="logoEmoji" th:value="${settings.logoEmoji}" maxlength="4">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tagline</label>
                        <input type="text" name="tagline" th:value="${settings.tagline}">
                    </div>
                    <div class="form-group">
                        <label>Currency symbol</label>
                        <input type="text" name="currency" th:value="${settings.currency}" maxlength="4" placeholder="$">
                    </div>
                </div>

                <div class="form-group">
                    <label>Hero title (big text on home page)</label>
                    <input type="text" name="heroTitle" th:value="${settings.heroTitle}">
                </div>
                <div class="form-group">
                    <label>Hero subtitle</label>
                    <textarea name="heroSubtitle" rows="2" th:text="${settings.heroSubtitle}"></textarea>
                </div>

                <div class="form-group">
                    <label>About text</label>
                    <textarea name="aboutText" rows="4" th:text="${settings.aboutText}"></textarea>
                </div>

                <h3 class="form-section">Contact information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" th:value="${settings.phone}">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" name="email" th:value="${settings.email}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="address" th:value="${settings.address}">
                </div>
                <div class="form-group">
                    <label>Working hours</label>
                    <input type="text" name="workingHours" th:value="${settings.workingHours}">
                </div>

                <h3 class="form-section">Social media (full link)</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Instagram</label>
                        <input type="text" name="instagram" th:value="${settings.instagram}" placeholder="https://instagram.com/...">
                    </div>
                    <div class="form-group">
                        <label>Telegram</label>
                        <input type="text" name="telegram" th:value="${settings.telegram}" placeholder="https://t.me/...">
                    </div>
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="text" name="whatsapp" th:value="${settings.whatsapp}" placeholder="https://wa.me/...">
                </div>

                <h3 class="form-section">Other</h3>
                <div class="form-group">
                    <label>Shipping note (shown under the hero)</label>
                    <input type="text" name="shippingNote" th:value="${settings.shippingNote}">
                </div>
                <div class="form-group">
                    <label>Footer text</label>
                    <input type="text" name="footerText" th:value="${settings.footerText}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">💾 Save settings</button>
                </div>
            </form>
        </div>

        <!-- Password change -->
        <div class="admin-card">
            <div class="admin-card-head"><h2>Change admin password</h2></div>
            <form th:action="@{/admin/settings/password}" method="post" class="admin-form">
                <div class="form-group">
                    <label>Current password</label>
                    <input type="password" name="currentPassword" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>New password</label>
                        <input type="password" name="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm new password</label>
                        <input type="password" name="confirmPassword" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">🔑 Change password</button>
                </div>
                <p class="form-hint">The default password is <code>admin123</code>. Be sure to change it.</p>
            </form>
        </div>

    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
