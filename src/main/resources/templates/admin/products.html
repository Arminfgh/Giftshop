<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Products')}"></head>
<body class="admin-body">
<aside th:replace="~{fragments/admin :: sidebar('products')}"></aside>
<div class="admin-main">
    <header th:replace="~{fragments/admin :: topbar('Products')}"></header>
    <div class="admin-content">

        <div th:if="${toast}" class="toast success" th:text="${toast}"></div>
        <div th:if="${error}" class="toast error" th:text="${error}"></div>

        <div class="admin-card">
            <div class="admin-card-head">
                <h2>Product list</h2>
                <a class="btn btn-primary" th:href="@{/admin/products/new}">➕ New product</a>
            </div>

            <table class="admin-table" th:if="${products != null and !products.isEmpty()}">
                <thead>
                <tr>
                    <th>Image</th><th>Name</th><th>Destination</th><th>Price</th>
                    <th>Stock</th><th>Featured</th><th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td>
                        <div class="table-thumb">
                            <img th:if="${p.imageUrl != null and p.imageUrl != ''}" th:src="${p.imageUrl}" th:alt="${p.name}">
                            <span th:unless="${p.imageUrl != null and p.imageUrl != ''}" th:text="${p.category != null ? p.category.icon : '🎁'}">🎁</span>
                        </div>
                    </td>
                    <td th:text="${p.name}">Name</td>
                    <td th:text="${p.category != null ? p.category.name : '—'}">—</td>
                    <td th:text="|${shop.currency}${#numbers.formatInteger(p.price,0,'COMMA')}|"></td>
                    <td th:text="${p.stock}">0</td>
                    <td><span th:text="${p.featured ? '⭐' : '—'}">—</span></td>
                    <td>
                        <span class="status-pill" th:classappend="${p.active} ? 'st-DELIVERED' : 'st-CANCELLED'"
                              th:text="${p.active ? 'Active' : 'Hidden'}">Active</span>
                    </td>
                    <td class="actions-cell">
                        <a class="btn btn-ghost btn-sm" th:href="@{/admin/products/edit/{id}(id=${p.id})}">Edit</a>
                        <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post"
                              onsubmit="return confirm('Delete this product?');" style="display:inline">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="empty-state" th:if="${products == null or products.isEmpty()}">
                <p>You haven't added any products yet.</p>
                <a class="btn btn-primary" th:href="@{/admin/products/new}">Add your first product</a>
            </div>
        </div>

    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
