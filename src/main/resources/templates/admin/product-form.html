<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Product')}"></head>
<body class="admin-body">
<aside th:replace="~{fragments/admin :: sidebar('products')}"></aside>
<div class="admin-main">
    <header th:replace="~{fragments/admin :: topbar(${product.id != null ? 'Edit product' : 'New product'})}"></header>
    <div class="admin-content">

        <div class="admin-card">
            <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" class="admin-form">
                <input type="hidden" name="id" th:if="${product.id != null}" th:value="${product.id}">

                <div class="form-group">
                    <label>Product name <span class="req">*</span></label>
                    <input type="text" name="name" th:value="${product.name}" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="4" th:text="${product.description}"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price <span class="req">*</span></label>
                        <input type="number" name="price" th:value="${product.price}" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Original price (optional, for showing a discount)</label>
                        <input type="number" name="oldPrice" th:value="${product.oldPrice}" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Destination</label>
                        <select name="categoryId" class="select">
                            <option value="">— None —</option>
                            <option th:each="c : ${categories}" th:value="${c.id}"
                                    th:text="${c.name}"
                                    th:selected="${product.category != null and product.category.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" name="stock" th:value="${product.stock}" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Product image</label>
                    <div class="image-preview" th:if="${product.imageUrl != null and product.imageUrl != ''}">
                        <img th:src="${product.imageUrl}" alt="Current image">
                        <span class="hint">Current image — to change it, upload a new file.</span>
                    </div>
                    <input type="file" name="imageFile" accept="image/*">
                    <p class="form-hint">Or paste an image URL:</p>
                    <input type="text" name="imageUrl" th:value="${product.imageUrl}" placeholder="https://...">
                </div>

                <div class="form-check-row">
                    <label class="check">
                        <input type="checkbox" name="featured" value="true" th:checked="${product.featured}">
                        <span>Show in "Featured"</span>
                    </label>
                    <label class="check">
                        <input type="checkbox" name="active" value="true" th:checked="${product.id == null ? true : product.active}">
                        <span>Active (visible in shop)</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">💾 Save product</button>
                    <a class="btn btn-ghost" th:href="@{/admin/products}">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
