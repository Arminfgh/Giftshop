<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <section class="page-head">
        <div class="container"><h1 class="page-title">Contact us</h1></div>
    </section>

    <section class="section">
        <div class="container contact-layout">
            <div class="contact-form card">
                <div th:if="${toast}" class="toast success" th:text="${toast}"></div>
                <h3>Send us a message</h3>
                <form th:action="@{/contact}" method="post">
                    <div class="form-group">
                        <label>Your name <span class="req">*</span></label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" name="phone">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" name="subject">
                    </div>
                    <div class="form-group">
                        <label>Message <span class="req">*</span></label>
                        <textarea name="content" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Send message</button>
                </form>
            </div>

            <aside class="contact-info card">
                <h3>Get in touch</h3>
                <ul class="info-list">
                    <li th:if="${shop.phone != ''}"><span>📞</span> <span th:text="${shop.phone}"></span></li>
                    <li th:if="${shop.email != ''}"><span>✉️</span> <span th:text="${shop.email}"></span></li>
                    <li th:if="${shop.address != ''}"><span>📍</span> <span th:text="${shop.address}"></span></li>
                    <li th:if="${shop.workingHours != ''}"><span>🕘</span> <span th:text="${shop.workingHours}"></span></li>
                </ul>
                <div class="socials big" th:if="${shop.instagram != '' or shop.telegram != '' or shop.whatsapp != ''}">
                    <a th:if="${shop.instagram != ''}" th:href="${shop.instagram}" target="_blank" rel="noopener" class="btn btn-outline">Instagram</a>
                    <a th:if="${shop.telegram != ''}" th:href="${shop.telegram}" target="_blank" rel="noopener" class="btn btn-outline">Telegram</a>
                    <a th:if="${shop.whatsapp != ''}" th:href="${shop.whatsapp}" target="_blank" rel="noopener" class="btn btn-outline">WhatsApp</a>
                </div>
            </aside>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
