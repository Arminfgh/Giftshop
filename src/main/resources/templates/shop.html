<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shop')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <section class="page-head">
        <div class="container">
            <h1 class="page-title">Shop</h1>
            <p class="page-sub" th:if="${activeCategoryName != null}" th:text="'Destination: ' + ${activeCategoryName}"></p>
            <p class="page-sub" th:if="${q != null and q != ''}" th:text="'Search results for: ' + ${q}"></p>
        </div>
    </section>

    <section class="section">
        <div class="container shop-layout">
            <!-- Sidebar filters -->
            <aside class="shop-sidebar">
                <form class="search-box" th:action="@{/shop}" method="get">
                    <input type="text" name="q" th:value="${q}" placeholder="Search products...">
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>

                <div class="filter-block">
                    <h4>Destinations</h4>
                    <ul class="filter-list">
                        <li><a th:href="@{/shop}" th:classappend="${activeCategory == null and (q == null or q == '')} ? 'active'">All products</a></li>
                        <li th:each="cat : ${navCategories}">
                            <a th:href="@{/shop(category=${cat.id})}"
                               th:classappend="${activeCategory != null and activeCategory == cat.id} ? 'active'">
                                <span th:text="${cat.icon}">🎁</span>
                                <span th:text="${cat.name}">Place</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="filter-block">
                    <h4>Sort by</h4>
                    <form th:action="@{/shop}" method="get">
                        <input type="hidden" name="category" th:if="${activeCategory != null}" th:value="${activeCategory}">
                        <input type="hidden" name="q" th:if="${q != null}" th:value="${q}">
                        <select name="sort" onchange="this.form.submit()" class="select">
                            <option value="newest" th:selected="${sort == 'newest'}">Newest</option>
                            <option value="cheap" th:selected="${sort == 'cheap'}">Price: low to high</option>
                            <option value="expensive" th:selected="${sort == 'expensive'}">Price: high to low</option>
                        </select>
                    </form>
                </div>
            </aside>

            <!-- Product grid -->
            <div class="shop-content">
                <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
                    <th:block th:each="p : ${products}"><div th:replace="~{fragments/components :: productCard(${p})}"></div></th:block>
                </div>
                <div class="empty-state big" th:if="${products == null or products.isEmpty()}">
                    <span class="empty-emoji">🧳</span>
                    <p>No products found.</p>
                    <a class="btn btn-outline" th:href="@{/shop}">Back to all products</a>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
