<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Product card, used on home and shop pages -->
<article th:fragment="productCard(product)" class="product-card">
    <a class="card-media" th:href="@{/product/{id}(id=${product.id})}">
        <img th:if="${product.imageUrl != null and product.imageUrl != ''}"
             th:src="${product.imageUrl}" th:alt="${product.name}" loading="lazy">
        <div th:unless="${product.imageUrl != null and product.imageUrl != ''}" class="media-placeholder">
            <span th:text="${product.category != null ? product.category.icon : '🎁'}">🎁</span>
        </div>
        <span class="badge-off" th:if="${product.discounted}">Sale</span>
    </a>
    <div class="card-body">
        <span class="card-cat" th:if="${product.category != null}" th:text="${product.category.name}">Place</span>
        <h3 class="card-title">
            <a th:href="@{/product/{id}(id=${product.id})}" th:text="${product.name}">Product name</a>
        </h3>
        <div class="card-price">
            <span class="price-now" th:text="|${shop.currency}${#numbers.formatInteger(product.price,0,'COMMA')}|">$0</span>
            <span class="price-old" th:if="${product.discounted}"
                  th:text="|${shop.currency}${#numbers.formatInteger(product.oldPrice,0,'COMMA')}|"></span>
        </div>
        <form th:action="@{/cart/add}" method="post">
            <input type="hidden" name="productId" th:value="${product.id}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn btn-primary btn-block">Add to cart 🛒</button>
        </form>
    </div>
</article>

</body>
</html>
