# ===== Server =====
# Uses the hosting platform's PORT if provided (e.g. Render), otherwise 8080 locally
server.port=${PORT:8080}

# ===== Database (H2 file-based, data is saved between runs) =====
spring.datasource.url=jdbc:h2:file:./data/giftshopdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# ===== H2 web console (visit http://localhost:8080/h2-console if you like) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== File upload (product images) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=./uploads

# ===== Encoding =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
